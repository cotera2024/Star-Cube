[package]
name = "star-cube"
version = "1.0.0"
description = "Star Cube"
authors = ["Isaac Daniel Cotera"]
license = "MIT"
repository = "https://github.com/cotera2024/Star-Cube"
edition = "2021"

[lib]
name = "star_cube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2" }
tauri-plugin-log = "2"
